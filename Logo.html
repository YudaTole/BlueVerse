<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Blue Archive Logo Generator (Fixed Layout)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1525;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    .controls { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
    .controls input { padding: 6px 10px; border-radius: 6px; border: none; }
    button { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; background: #1890ff; color: white; }
    #svgWrapper { background: white; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <h2>Blue Archive Style Logo Generator</h2>
  <div class="controls">
    <input id="word1" value="Blue" />
    <input id="word2" value="Archive" />
    <input id="word3" value="Logo Generator" />
    <button onclick="renderLogo()">Render</button>
  </div>
  <div class="controls">
    <button onclick="downloadSVG()">Download SVG</button>
    <button onclick="downloadPNG()">Download PNG</button>
  </div>
  <div id="svgWrapper"></div>

  <script>
    function renderLogo() {
      const w1 = document.getElementById('word1').value;
      const w2 = document.getElementById('word2').value;
      const w3 = document.getElementById('word3').value;

      const fontSize = 78;
      const startX = 40;
      const baselineY = 120;

      // posisi kata pertama
      const w1X = startX;
      // panjang kasar kata pertama
      const w1Width = w1.length * (fontSize * 0.55);
      // posisi kata kedua setelah kata pertama
      const w2X = w1X + w1Width + 10;

      // posisi orbit di sekitar huruf A dari kata kedua
      const orbitX = w2X + 30; 
      const orbitY = baselineY - 35;

      // subtitle rata kanan dengan kata kedua
      const w2Width = w2.length * (fontSize * 0.55);
      const subtitleX = w2X + w2Width - (w3.length * 9); 
      const subtitleY = baselineY + 45;

      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="900" height="240" viewBox="0 0 900 240">
        <defs>
          <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0ea5ff"/>
            <stop offset="100%" stop-color="#1890ff"/>
          </linearGradient>
        </defs>

        <!-- Kata pertama -->
        <text x="${w1X}" y="${baselineY}" font-family="Arial Black, sans-serif" 
              font-size="${fontSize}" font-style="italic" fill="url(#blueGrad)">
          ${w1}
        </text>

        <!-- Kata kedua -->
        <text x="${w2X}" y="${baselineY}" font-family="Arial Black, sans-serif" 
              font-size="${fontSize}" font-style="italic" fill="#222">
          ${w2}
        </text>

        <!-- Orbit & silang -->
        <g transform="translate(${orbitX},${orbitY})">
          <ellipse rx="110" ry="32" fill="none" stroke="#555" stroke-width="3" transform="rotate(-18)"/>
          <line x1="-30" y1="-40" x2="30" y2="40" stroke="#0ea5ff" stroke-width="5" stroke-linecap="round"/>
          <line x1="25" y1="-40" x2="-25" y2="40" stroke="#06a6ff" stroke-width="3" stroke-linecap="round"/>
        </g>

        <!-- Subtitle -->
        <text x="${subtitleX}" y="${subtitleY}" font-family="Arial, sans-serif" 
              font-size="20" fill="#555">
          ${w3}
        </text>
      </svg>`;

      document.getElementById('svgWrapper').innerHTML = svg;
    }

    function downloadSVG() {
      const svgEl = document.querySelector('#svgWrapper svg');
      const data = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([data], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'logo.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG() {
      const svgEl = document.querySelector('#svgWrapper svg');
      const data = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([data], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        canvas.width = 900;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob){
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'logo.png';
          a.click();
        });
      };
      img.src = url;
    }

    renderLogo();
  </script>
</body>
</html>
