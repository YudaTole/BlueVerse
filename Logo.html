<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Blue Archive Logo Generator (Official Style)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0e1525;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px;
    }
    h1 { font-size: 22px; margin-bottom: 10px; }
    .controls { margin-bottom: 15px; display: flex; flex-wrap: wrap; gap: 10px; }
    .controls input { padding: 6px 10px; border-radius: 6px; border: none; }
    button { padding: 8px 14px; border-radius: 6px; border: none; cursor: pointer; background: #1890ff; color: white; }
    #svgWrapper { background: white; padding: 20px; border-radius: 10px; }
  </style>
</head>
<body>
  <h1>Blue Archive Style Logo Generator</h1>
  <div class="controls">
    <input id="word1" value="Blue" />
    <input id="word2" value="Archive" />
    <input id="word3" value="Logo Generator" />
    <button onclick="renderLogo()">Render</button>
    <button onclick="downloadSVG()">Download SVG</button>
    <button onclick="downloadPNG()">Download PNG</button>
  </div>
  <div id="svgWrapper"></div>

  <script>
    function renderLogo(){
      const w1 = document.getElementById('word1').value;
      const w2 = document.getElementById('word2').value;
      const w3 = document.getElementById('word3').value;

      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="800" height="240" viewBox="0 0 800 240">
        <defs>
          <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#0ea5ff"/>
            <stop offset="100%" stop-color="#1890ff"/>
          </linearGradient>
        </defs>

        <!-- Orbit -->
        <g transform="translate(400,80)">
          <ellipse rx="210" ry="60" fill="none" stroke="#666" stroke-width="4" transform="rotate(-18)"/>
          <line x1="-60" y1="-70" x2="60" y2="70" stroke="#0ea5ff" stroke-width="6" stroke-linecap="round"/>
          <line x1="45" y1="-70" x2="-45" y2="70" stroke="#06a6ff" stroke-width="4" stroke-linecap="round"/>
        </g>

        <!-- Texts -->
        <text x="40" y="120" font-family="Arial Black, sans-serif" font-size="78" font-style="italic" fill="url(#blueGrad)">
          ${w1}
        </text>
        <text x="${40 + w1.length*45}" y="120" font-family="Arial Black, sans-serif" font-size="78" font-style="italic" fill="#222">
          ${w2}
        </text>
        <text x="${40 + w1.length*45}" y="170" font-family="Arial, sans-serif" font-size="20" fill="#444">
          ${w3}
        </text>
      </svg>`;
      document.getElementById('svgWrapper').innerHTML = svg;
    }

    function downloadSVG(){
      const svgEl = document.querySelector('#svgWrapper svg');
      const data = new XMLSerializer().serializeToString(svgEl);
      const blob = new Blob([data], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'logo.svg';
      a.click();
      URL.revokeObjectURL(url);
    }

    function downloadPNG(){
      const svgEl = document.querySelector('#svgWrapper svg');
      const data = new XMLSerializer().serializeToString(svgEl);
      const svgBlob = new Blob([data], {type: 'image/svg+xml;charset=utf-8'});
      const url = URL.createObjectURL(svgBlob);
      const img = new Image();
      img.onload = function(){
        const canvas = document.createElement('canvas');
        canvas.width = 800;
        canvas.height = 240;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0);
        URL.revokeObjectURL(url);
        canvas.toBlob(function(blob){
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'logo.png';
          a.click();
        });
      };
      img.src = url;
    }

    renderLogo();
  </script>
</body>
</html>
