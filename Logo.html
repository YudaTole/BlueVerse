<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueArchive-Style Logo Generator</title>
  <style>
    body {
      font-family: "Arial", sans-serif;
      text-align: center;
      padding: 20px;
      background: #f8f9fa;
    }
    #logo {
      margin: 20px auto;
      width: 90%;
      max-width: 600px;
    }
    .input-box {
      margin: 5px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin: 5px;
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      background: #0d6efd;
      color: white;
      cursor: pointer;
      font-size: 15px;
    }
    button:hover {
      background: #0b5ed7;
    }
  </style>
</head>
<body>
  <h2>BlueArchive-Style Logo Generator</h2>
  
  <input id="text1" class="input-box" type="text" value="Yudz" placeholder="Kata kiri (biru)">
  <input id="text2" class="input-box" type="text" value="Senpai" placeholder="Kata kanan (hitam)">
  <input id="subtext" class="input-box" type="text" value="BlueVerse" placeholder="Subtext">
  <br>
  <button onclick="generateLogo()">Generate</button>
  <button onclick="downloadSVG()">Save</button>

  <div id="logo">
    <!-- SVG hasil akan masuk di sini -->
  </div>

  <script>
    function generateLogo() {
      const t1 = document.getElementById("text1").value;
      const t2 = document.getElementById("text2").value;
      const sub = document.getElementById("subtext").value;

      const svg = `
      <svg xmlns="http://www.w3.org/2000/svg" width="600" height="180" viewBox="0 0 600 180">
        <!-- Orbit ellipse -->
        <ellipse cx="310" cy="90" rx="120" ry="40" 
          transform="rotate(-20, 310, 90)" 
          stroke="#1E90FF" stroke-width="3" fill="none" />

        <!-- Text kiri (biru) -->
        <text x="120" y="95" font-size="48" font-weight="bold" fill="#1E90FF">${t1}</text>

        <!-- Text kanan (hitam) -->
        <text x="280" y="95" font-size="48" font-weight="bold" fill="#222">${t2}</text>

        <!-- Subtext kecil -->
        <text x="280" y="130" font-size="20" fill="#666">${sub}</text>
      </svg>`;

      document.getElementById("logo").innerHTML = svg;
    }

    function downloadSVG() {
      const svg = document.getElementById("logo").innerHTML;
      const blob = new Blob([svg], { type: "image/svg+xml" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "bluearchive_logo.svg";
      a.click();
      URL.revokeObjectURL(url);
    }

    // Generate awal
    generateLogo();
  </script>
</body>
</html>
