<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>BlueVerse Logo</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: #fff;
    }
    #logo {
      display: inline-block;
      padding: 20px;
    }
    .blue {
      fill: #1e90ff;
      font-weight: bold;
      font-style: italic;
    }
    .black {
      fill: #222;
      font-weight: bold;
      font-style: italic;
    }
    .subtext {
      fill: #444;
      font-size: 28px;
      font-style: italic;
    }
    button {
      margin-top: 20px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 8px;
      border: none;
      background: #1e90ff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0c70d4;
    }
  </style>
</head>
<body>
  <div id="logo">
    <svg width="600" height="250" xmlns="http://www.w3.org/2000/svg">
      <!-- Tulisan BlueVerse -->
      <text x="40" y="120" font-size="80" letter-spacing="-2px">
        <tspan class="blue">Blue</tspan><tspan class="black">Verse</tspan>
      </text>

      <!-- Orbit ellipse -->
      <ellipse cx="320" cy="90" rx="120" ry="40"
        stroke="#000" stroke-width="3" fill="none"
        transform="rotate(-15,320,90)" />

      <!-- Cross light -->
      <line x1="320" y1="10" x2="320" y2="170"
        stroke="#1e90ff" stroke-width="4" />
      <line x1="250" y1="50" x2="420" y2="130"
        stroke="#1e90ff" stroke-width="4" />

      <!-- Subtext Unit1 -->
      <text x="420" y="190" class="subtext">Unit1</text>
    </svg>
  </div>

  <button onclick="saveLogo()">Save as PNG</button>

  <script>
    function saveLogo() {
      const logo = document.getElementById("logo");
      html2canvas(logo, {backgroundColor: null}).then(canvas => {
        const link = document.createElement("a");
        link.download = "blueverse_logo.png";
        link.href = canvas.toDataURL();
        link.click();
      });
    }
  </script>
</body>
</html>
