<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BlueVerse Style Logo Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <!-- Font mirip Blue Archive -->
  <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@1,700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Exo', sans-serif;
      text-align: center;
      background: #fff;
      padding: 20px;
    }
    #controls {
      margin-bottom: 15px;
    }
    input {
      margin: 5px;
      padding: 8px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      margin: 10px;
      padding: 10px 20px;
      font-size: 16px;
      border-radius: 6px;
      border: none;
      background: #1e90ff;
      color: white;
      cursor: pointer;
    }
    button:hover {
      background: #0c70d4;
    }
    #logo-container {
      display: inline-block;
      margin-top: 20px;
    }
    svg text {
      font-family: 'Exo', sans-serif;
      font-style: italic;
      font-weight: 700;
      letter-spacing: -2px;
    }
  </style>
</head>
<body>
  <h2>BlueVerse Style Logo Generator</h2>

  <div id="controls">
    <input id="text1" type="text" value="Blue" placeholder="Tulisan kiri (biru)">
    <input id="text2" type="text" value="Verse" placeholder="Tulisan kanan (hitam)">
    <input id="subtext" type="text" value="Unit1" placeholder="Tulisan kecil bawah kanan">
    <br>
    <button onclick="renderLogo()">Generate</button>
    <button onclick="savePNG()">Save as PNG</button>
  </div>

  <div id="logo-container"></div>

  <script>
    function renderLogo() {
      const t1 = document.getElementById("text1").value;
      const t2 = document.getElementById("text2").value;
      const sub = document.getElementById("subtext").value;

      const svg = `
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" viewBox="0 0 600 200">
  <!-- Orbit ellipse -->
  <ellipse cx="330" cy="85" rx="130" ry="42"
    transform="rotate(-18 330 85)"
    stroke="#1e90ff" stroke-width="1.5" fill="none" />

  <!-- Cross light -->
  <line x1="330" y1="15" x2="330" y2="160"
    stroke="#1e90ff" stroke-width="2" />
  <line x1="270" y1="40" x2="390" y2="130"
    stroke="#1e90ff" stroke-width="2" />

  <!-- Text utama -->
  <text x="60" y="105" font-size="72">
    <tspan fill="#1e90ff">${t1}</tspan><tspan fill="#000">${t2}</tspan>
  </text>

  <!-- Subtext -->
  <text x="420" y="160" font-size="22" fill="#444" font-style="italic">${sub}</text>
</svg>`;

      document.getElementById("logo-container").innerHTML = svg;
    }

    function savePNG() {
      const container = document.getElementById("logo-container");
      html2canvas(container, { backgroundColor: null }).then(canvas => {
        const link = document.createElement("a");
        link.download = "logo.png";
        link.href = canvas.toDataURL("image/png");
        link.click();
      });
    }

    // Render pertama
    renderLogo();
  </script>
</body>
</html>
